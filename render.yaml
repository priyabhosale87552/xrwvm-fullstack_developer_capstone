databases:
  - name: dealership-reviews-db
    databaseName: dealership_reviews
    user: dealership_reviews_user
    plan: free

services:
  - type: web
    name: priyabhosale-dealership
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn server.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: dealership-reviews-db
          property: connectionString
