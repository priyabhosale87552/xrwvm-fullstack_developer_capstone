<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Dealership Directory</title>
    <style>
        :root { font-family: Arial, Helvetica, sans-serif; color: #172033; background: #f3f6fb; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        header { padding: 1.1rem max(1.5rem, calc((100% - 1120px) / 2)); background: #142a4f; }
        header a { color: white; font-weight: 700; text-decoration: none; }
        main { width: min(440px, calc(100% - 2rem)); margin: 4rem auto; padding: 2rem; border: 1px solid #e1e7f0; border-radius: .8rem; background: white; box-shadow: 0 8px 22px rgba(20, 42, 79, .08); }
        h1 { margin-top: 0; }
        form { display: grid; gap: 1rem; }
        label { display: grid; gap: .4rem; font-weight: 700; }
        input { width: 100%; padding: .75rem; border: 1px solid #cbd5e1; border-radius: .4rem; font: inherit; }
        button { padding: .8rem 1rem; border: 0; border-radius: .4rem; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <header><a href="{% url 'home' %}">Dealership Directory</a></header>
    <main>
        <h1>Log in</h1>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="username">Username
                <input id="username" name="username" autocomplete="username" required>
            </label>
            <label for="password">Password
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
